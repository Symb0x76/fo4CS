; LightLimitFix PreNG diagnostic switches.
;
; Read EXCLUSIVELY from this file (Data\F4SE\Plugins\CommunityShaders\Debug.ini).
; Process environment variables and registry (HKCU/HKLM) are NO LONGER consulted
; for these switches, so a polluted launcher/MO2 environment cannot flip them.
;
; Keys use the same FO4CS_* names the code and logs reference. Truthy values:
;   1, true, TRUE, on, ON   (anything else, or a missing key, = OFF)
; Numeric (budget/interval) keys take a plain unsigned integer.
;
; A missing key defaults OFF (switches) / unset (numeric). Changes take effect on
; the next game launch (the file is parsed once at first switch access).

[Switches]

; --- Active BSLighting visible-consumer LLF profile -------------------------
; The shipping clustered-lighting profile (BOSS-confirmed working: clustered
; lighting visible, no post-LockpickingMenu FPS drop with FrameGen on). The
; clustered compute is submitted from the shadow-map phase by default
; (FO4CS_LLF_PRENG_PREPASS_EARLY_HOOK, default ON in code) to avoid the GPU
; downclock. To run an "all LLF OFF" A/B, set these to 0.
FO4CS_LLF_PRENG_POINT_LIGHT_HOOK = 1
FO4CS_LLF_PRENG_STRICT_CB_DIAG = 1
FO4CS_LLF_PRENG_BIND_STRICT_CB = 1
FO4CS_LLF_PRENG_BIND_CLUSTER_SRVS = 1
FO4CS_LLF_PRENG_BSLIGHTING_RESOURCE_BIND = 1
FO4CS_LLF_PRENG_BSLIGHTING_SETUP_GEOMETRY_RESOURCE_BIND = 1
FO4CS_LLF_PRENG_BSLIGHTING_LLF_BIND = 1
; A/B 2026-08-15 done (issue #36): 30fps in workshop menu is unrelated to this
; hook (BIND=0 still 30fps). Re-enabled for the DFLight consumer work.
; TEMP PROOF: allow the visible consumer to bind while a menu is open (FO4 only
; performs BSLighting shader lookups for the menu 3D preview, so this is how we
; exercise the bind path to llfConsumerComplete=true). Keep 0 for normal play.
FO4CS_LLF_PRENG_BSLIGHTING_LLF_BIND_MENU = 1

; --- SetupGeometry hook (default OFF) ---------------------------------------
FO4CS_LLF_PRENG_SETUP_GEOMETRY_HOOK = 0
FO4CS_LLF_PRENG_SETUP_GEOMETRY_BIND_STRICT_CB = 0
FO4CS_LLF_PRENG_SETUP_GEOMETRY_PERSIST_STRICT_CB = 0

; --- Clustered prepass tuning (default OFF / unset) -------------------------
FO4CS_LLF_PRENG_PERSISTENT_CLUSTER_PREPASS = 0
; Submit the clustered compute from the shadow-map phase (EarlyPrepass) instead
; of frame-start. DEFAULT ON — this fixes the post-LockpickingMenu GPU downclock
; under FrameGen. Set =0 only to force the legacy frame-start site for diagnostics.
; FO4CS_LLF_PRENG_PREPASS_EARLY_HOOK = 0
; FO4CS_LLF_PRENG_PERSISTENT_CLUSTER_PREPASS_REFRESH_INTERVAL =
; FO4CS_LLF_PRENG_CLUSTER_PREPASS_REUSE =
; FO4CS_LLF_PRENG_SHADOW_SCENE_FAST_REUSE =
; FO4CS_LLF_PRENG_SHADOW_SCENE_FAST_REUSE_REFRESH_INTERVAL =
; FO4CS_LLF_PRENG_CLUSTER_PREPASS_PROOF_FRAMES =
; FO4CS_LLF_PRENG_BSLIGHTING_RESOURCE_PREPASS_FRAMES =
; FO4CS_LLF_PRENG_PREPASS_BIND_RESOURCES =

; --- BSLighting consumer observe (default OFF) ------------------------------
; TEMP DIAGNOSTIC: log every BSLighting shader lookup (shader type + fxp +
; vertex/pixel descriptors) so we can see whether the forward BSLighting path
; is exercised during normal gameplay and which pixel descriptors it uses.
FO4CS_LLF_PRENG_BSLIGHTING_DESCRIPTOR_OBSERVE = 1
FO4CS_LLF_PRENG_BSLIGHTING_VANILLA_BIND = 0

; --- DFLight forward consumer reconstruction (pivot 2026-08-15) -------------
; Dump the vanilla BSDFLightShader PS (forward descriptors 0x204/0x8004) to
; MO2 overwrite\F4SE\Plugins\CommunityShaders\ShaderDump\... as the vanilla
; baseline for the DFLight LLF consumer reconstruction.
; FO4CS_LLF_PRENG_DFLIGHT_VANILLA_DUMP = 1
FO4CS_LLF_PRENG_DFLIGHT_VANILLA_DUMP = 0
; First-visible DFLight forward clustered replacement: first point-light pass of
; each frame -> DFLightForwardConsumerPS (t35-t37 cluster loop), the rest ->
; DFLightZeroOutputPS.
FO4CS_LLF_PRENG_DFLIGHT_FORWARD_LLF_BIND = 1
; Shadow-scene preview overload gate (>=256 bucket lights holds the clustered
; prepass). Set =1 to DISABLE the gate so LLF keeps running in dense scenes;
; re-enable (=0) if post-menu stutter returns. 2026-08-15 test: disabled.
FO4CS_LLF_PRENG_DISABLE_PREVIEW_OVERLOAD_GATE = 1

; --- Misc diagnostics (default OFF) -----------------------------------------
FO4CS_LLF_PRENG_SHADER_OBJECT_METADATA = 0
FO4CS_TRACE_LLF_PS = 0
; D3D11 Deferred instrumentation. Writes PipelineTrace/<runtime>/deferred_trace.txt,
; emits a RenderDoc-visible FO4CS Deferred Lighting MRT marker, and records
; renderer target formats plus override/restore OM state. Keep OFF for normal play.
FO4CS_TRACE_DEFERRED = 0
; With trace enabled, dump the first completed world-epoch GBuffer to staging
; .bin files and matching metadata under PipelineTrace/<runtime>/.
FO4CS_DUMP_GBUFFER = 0

; --- GPU timing (diagnostic, default OFF) -----------------------------------
; Wraps the clustered compute block (cluster-building + culling dispatch) in
; D3D11 timestamp queries and logs per-frame GPU milliseconds:
;   [LightLimitFix] PreNG cluster compute GPU time frame=... lights=... gpuMs=...
; Set =1 only to measure cluster compute cost; off for normal play.
FO4CS_LLF_PRENG_GPU_TIMING = 0

; --- D3D12 debug layer (diagnostic, default OFF) ----------------------------
; Attaches the D3D12 debug layer to our proxy device before it is created and
; copies every validation error/warning into CommunityShaders.log as [D3D12]
; lines, tagged with where in Present they were produced:
;   fsr-frame-generation-drive = raised inside ffx::Configure / ffx::Dispatch
;   present-end                = raised by our own recording, barriers or execute
; This is here to name the invalid call behind the frame-generation device
; removal (GetDeviceRemovedReason reports DXGI_ERROR_INVALID_CALL = 0x887A0001).
; Costs a lot of CPU per API call, so turn it back to 0 for normal play.
; Requires the Windows "Graphics Tools" optional feature (D3D12SDKLayers.dll).
FO4CS_D3D12_DEBUG_LAYER = 1


